name: Prelaunch account safety checks (PR only)

on:
  pull_request:
    branches:
      - release/siftalpha-web-v1
    paths:
      - 'core/**'
      - 'quant_site/**'
      - 'deployment/web-admin/**'
      - 'frontend/**'
      - '.env.example'
      - '.github/workflows/account-safety-pr.yml'

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_SECRET_KEY: synthetic-only-account-safety-ci
      DJANGO_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate schema, permissions and verified signup
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test core formula_editor --noinput
      - name: Validate narrow deployment migration and secret security guards
        run: |
          python -m unittest discover -s deployment/web-admin/tests -p test_database_migration.py
          python -m unittest discover -s deployment/web-admin/tests -p test_upgrade_web_admin.py
          bash deployment/web-admin/tests/test_web_admin.sh


  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and check existing frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run test:indicators
          npm run test:realtime
          npm run test:chart
          node src/workspaceState.test.mjs
          npm run build

  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_SECRET_KEY: synthetic-only-upgrade-ci
      DJANGO_DEBUG: '1'
      HUNTALPHA_DATABASE_PATH: ${{ github.workspace }}/old/legacy.sqlite3
    steps:
      - name: Checkout deployed baseline
        uses: actions/checkout@v4
        with:
          ref: 07903d29e32f23a5e04db1888f2047073808542b
          path: old
      - name: Checkout proposed account change
        uses: actions/checkout@v4
        with:
          path: new
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned requirements
        run: python -m pip install -r new/requirements.txt
      - name: Create synthetic baseline users and four formulas
        working-directory: old
        run: |
          python manage.py migrate --noinput
          python manage.py shell -c '
          from django.contrib.auth import get_user_model
          from core.models import AccountMembership, MarketSymbol, WatchlistEntry
          from formula_editor.models import Formula
          u=get_user_model().objects.create_user(username="synthetic@example.com",email="synthetic@example.com",password="only-ci-password")
          AccountMembership.objects.filter(user=u).update(tier="pro")
          s=MarketSymbol.objects.create(code="US.SAFETEST",name="Synthetic",market="us",security_type="STOCK",provider="synthetic",provider_symbol="SAFETEST")
          WatchlistEntry.objects.create(user=u,symbol=s)
          for i in range(4):
              Formula.objects.create(code=f"SAFE_{i}",name=f"Synthetic {i}",source=f"SAFE_SYNTHETIC_{i}:MA(C,5);",placement="main")
          '
      - name: Migrate only the synthetic database and check preserved rows
        working-directory: new
        run: |
          python manage.py migrate --noinput
          python manage.py shell -c '
          from django.contrib.auth import get_user_model
          from core.models import AccountMembership, WatchlistEntry, PendingEmailRegistration, AuthRateLimit
          from formula_editor.models import Formula
          u=get_user_model().objects.get(username="synthetic@example.com")
          assert AccountMembership.objects.get(user=u).tier=="pro"
          assert WatchlistEntry.objects.filter(user=u,symbol__code="US.SAFETEST").count()==1
          assert Formula.objects.count()==4
          for i in range(4):
              assert Formula.objects.get(code=f"SAFE_{i}").source==f"SAFE_SYNTHETIC_{i}:MA(C,5);"
          assert PendingEmailRegistration.objects.count()==0
          assert AuthRateLimit.objects.count()==0
          print("synthetic upgrade preserves member, PRO, watchlist and 4 formula sources: PASS")
          '
      - name: Check changed files contain no whitespace errors
        working-directory: new
        run: git diff --check ${{ github.event.pull_request.base.sha }} HEAD

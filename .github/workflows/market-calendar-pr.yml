name: V2.0.1 Market Calendar PR Checks

on:
  pull_request:
    branches:
      - release/siftalpha-web-v1
    paths:
      - "core/marketdata/**"
      - "core/realtime/state.py"
      - "core/views.py"
      - "core/test_marketdata_calendar.py"
      - "frontend/src/components/MarketChart.vue"
      - "frontend/src/realtime/sourceSwitch*"
      - "frontend/package.json"
      - "frontend/src/components/SiteVersionFooter*"
      - "scripts/verify_web_release_workflow.py"
      - ".github/workflows/siftalpha-web-arm64.yml"
      - ".github/workflows/market-calendar-pr.yml"

permissions:
  contents: read

jobs:
  market-calendar-contract:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: pr-test-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Django and market-data timestamp tests
        run: |
          python -m pip install -r requirements.txt
          python manage.py check
          python manage.py test core.test_marketdata_calendar core.test_marketdata_core core.test_marketdata_providers core.test_marketdata_public core.test_marketdata_realtime core.test_marketdata_source_admin
          python manage.py makemigrations --check --dry-run
          python scripts/verify_web_release_workflow.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check chart source switch, version and frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run test:realtime
          npm run test:chart
          node src/realtime/chartTimeFormat.test.mjs
          node src/components/SiteVersionFooter.test.mjs
          npm run build

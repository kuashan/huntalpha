name: V1.1.11 Stock Fear-Greed PR Checks

on:
  pull_request:
    branches:
      - release/siftalpha-web-v1
    paths:
      - "core/stock_fear_greed.py"
      - "core/test_stock_fear_greed.py"
      - "core/views.py"
      - "quant_site/urls.py"
      - "frontend/**"
      - ".github/workflows/stock-fear-greed-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-check:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: pr-test-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Django adapter and configuration checks
        run: |
          python -m pip install -r requirements.txt
          python manage.py check
          python manage.py test core.test_stock_fear_greed
          python manage.py makemigrations --check --dry-run
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend contracts and build
        working-directory: frontend
        run: |
          npm ci
          npm run test:ui
          node src/components/SiteVersionFooter.test.mjs
          npm run build

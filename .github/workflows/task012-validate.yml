name: Task 012 isolated validation

on:
  push:
    branches:
      - feat/012-formula-manager-entitlements-20261017
  pull_request:
    branches:
      - feat/011-free-pro-membership-watchlist-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_SECRET_KEY: task012-isolated-synthetic-key-not-production
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Django check
        run: python manage.py check
      - name: Migration definition check without production DB
        run: python manage.py makemigrations --check --dry-run
      - name: Test isolated synthetic database
        run: python manage.py test core formula_editor --noinput

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Indicator regression tests
        working-directory: frontend
        run: npm run test:indicators
      - name: Realtime regression tests
        working-directory: frontend
        run: npm run test:realtime
      - name: Chart regression tests
        working-directory: frontend
        run: npm run test:chart
      - name: Frontend build
        working-directory: frontend
        run: npm run build

  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace in Task 012 changes
        run: git diff --check ${{ github.event.pull_request.base.sha || 'ebd23f4248219fb70fe457ac800d5603fbf47ef1' }} HEAD

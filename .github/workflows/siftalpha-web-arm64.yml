name: SiftAlpha Web CI and ARM64

on:
  push:
    branches:
      - release/siftalpha-web-v1

permissions:
  contents: read
  packages: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/siftalpha-web
      PLATFORM: linux/arm64
      SOURCE_COMMIT: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW_NAME: SiftAlpha Web CI and ARM64
      SOURCE_REF: refs/heads/release/siftalpha-web-v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Django checks
        env:
          DJANGO_SECRET_KEY: ci-build-only-secret
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py check
          python manage.py test core
          python manage.py makemigrations --check
          python -m unittest discover -s deployment/web-admin/tests -p test_database_migration.py
          python -m unittest discover -s deployment/web-admin/tests -p test_upgrade_web_admin.py
          bash deployment/web-admin/tests/test_web_admin.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test:indicators
          npm run test:realtime
          npm run test:chart
          npm run test:workspace
          node src/components/SiteVersionFooter.test.mjs
          npm run build

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/siftalpha-web
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=v1.1.0-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=V1.1.0
            io.siftalpha.build.run-id=${{ github.run_id }}
            io.siftalpha.build.ref=${{ github.ref_name }}

      - name: Build and push ARM64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max,version=v1

      - name: Verify OCI BuildKit provenance
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          record = {
              "image": os.environ["IMAGE"],
              "digest": os.environ["DIGEST"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "run_id": os.environ["RUN_ID"],
              "run_url": os.environ["RUN_URL"],
              "ref": "release/siftalpha-web-v1",
              "source_ref": os.environ["SOURCE_REF"],
              "workflow": os.environ["WORKFLOW_NAME"],
              "platform": os.environ["PLATFORM"],
              "tags": [tag for tag in os.environ["IMAGE_TAGS"].splitlines() if tag],
              "provenance": "buildkit-oci-slsa",
          }
          Path("siftalpha-web-build-manifest.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          mkdir -p "$RUNNER_TEMP/siftalpha-provenance"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Manifest}}' > "$RUNNER_TEMP/siftalpha-provenance/manifest.json"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Provenance.SLSA}}' > "$RUNNER_TEMP/siftalpha-provenance/provenance.json"
          python deployment/web-admin/lib/verify_buildkit_provenance.py \
            "siftalpha-web-build-manifest.json" \
            "$RUNNER_TEMP/siftalpha-provenance/manifest.json" \
            "$RUNNER_TEMP/siftalpha-provenance/provenance.json" \
            "$DIGEST" "$SOURCE_COMMIT" "$RUN_ID" "$SOURCE_REF" "$WORKFLOW_NAME"

      - name: Write immutable build manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          record = {
              "image": os.environ["IMAGE"],
              "digest": os.environ["DIGEST"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "run_id": os.environ["RUN_ID"],
              "run_url": os.environ["RUN_URL"],
              "ref": "release/siftalpha-web-v1",
              "source_ref": os.environ["SOURCE_REF"],
              "workflow": os.environ["WORKFLOW_NAME"],
              "platform": os.environ["PLATFORM"],
              "tags": [tag for tag in os.environ["IMAGE_TAGS"].splitlines() if tag],
              "provenance": "buildkit-oci-slsa",
          }
          Path("siftalpha-web-build-manifest.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(record, sort_keys=True))
          PY
          {
            echo "IMAGE=$IMAGE"
            echo "DIGEST=$DIGEST"
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "RUN_ID=$RUN_ID"
            echo "RUN_URL=$RUN_URL"
            echo "SOURCE_REF=$SOURCE_REF"
            echo "PLATFORM=$PLATFORM"
            echo "PROVENANCE=buildkit-oci-slsa"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable build manifest
        uses: actions/upload-artifact@v4
        with:
          name: siftalpha-web-build-manifest
          path: siftalpha-web-build-manifest.json
          if-no-files-found: error

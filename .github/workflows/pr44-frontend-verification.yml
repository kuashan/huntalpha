name: PR44 Frontend Verification
on:
  push:
    branches:
      - ci/pr44-chart-parity-test-20261018
permissions:
  contents: read
jobs:
  chart-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Verify common indicators
        working-directory: frontend
        run: npm run test:indicators
      - name: Verify realtime chart
        working-directory: frontend
        run: npm run test:realtime
      - name: Verify chart update
        working-directory: frontend
        run: npm run test:chart
      - name: Build frontend for production
        working-directory: frontend
        run: npm run build
